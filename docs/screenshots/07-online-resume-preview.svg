    <text x="675" y="302" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-style="italic" text-anchor="end">May 2025 – Aug 2025 (San Francisco, CA)</text>
    <text x="45" y="318" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">&bull; Engineered high-performance Spring Boot 3 microservices handling 25,000+ daily telemetry requests</text>
    <text x="45" y="331" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">&bull; Optimized JPA queries with custom fetch joins, eliminating N+1 bottlenecks and cutting latency by 42%</text>
    <text x="45" y="344" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">&bull; Wrote comprehensive test suites with JUnit 5 and MockMvc achieving over 90% branch coverage</text>

    <!-- Experience 2 -->
    <text x="35" y="368" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700">Teaching Assistant - OOP <tspan font-weight="400" fill="#334155">| Dept. of Computer Science</tspan></text>
    <text x="675" y="368" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-style="italic" text-anchor="end">Jan 2025 – May 2025 (Campus)</text>
    <text x="45" y="384" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">&bull; Mentored 120+ students on Core Java, SOLID principles, exception hierarchies, and multi-threading</text>

    <!-- Key Projects Section -->
    <text x="35" y="415" fill="#7c3aed" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">KEY PROJECTS</text>
    <line x1="35" y1="422" x2="675" y2="422" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="35" y="439" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700">Java Projects 10-Module Portfolio <tspan font-style="italic" font-size="9.5" fill="#7c3aed">(Java 17, Spring Boot, JPA, OpenPDF)</tspan></text>
    <text x="675" y="439" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-decoration="underline" text-anchor="end">github.com/alex-mercer-dev/java-projects</text>
    <text x="35" y="454" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Architected a production-ready Maven multi-module portfolio covering cryptographic tools, DSA solvers, and web apps.</text>

    <text x="35" y="476" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700">Constraint-Satisfaction Seating Solver <tspan font-style="italic" font-size="9.5" fill="#7c3aed">(Core Java, CSP, OpenPDF)</tspan></text>
    <text x="675" y="476" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-decoration="underline" text-anchor="end">github.com/alex-mercer-dev/exam-seating</text>
    <text x="35" y="491" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Engineered a room allocation algorithm enforcing orthogonal non-adjacent same-subject constraints for exam halls.</text>

    <!-- Education Section -->
    <text x="35" y="522" fill="#7c3aed" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">EDUCATION</text>
    <line x1="35" y1="529" x2="675" y2="529" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="35" y="546" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700">B.Tech in Computer Science &amp; Engineering <tspan font-weight="400" fill="#334155">— Apex Institute of Technology</tspan></text>
    <text x="675" y="546" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" text-anchor="end">2023 – 2027 | <tspan font-weight="700" fill="#0f172a">CGPA 9.35 / 10.0</tspan></text>

    <!-- Certifications Section -->
    <text x="35" y="578" fill="#7c3aed" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">CERTIFICATIONS</text>
    <line x1="35" y1="585" x2="675" y2="585" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="35" y="602" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700">Oracle Certified Professional: Java SE 17 Developer <tspan font-weight="400" fill="#334155">&bull; Oracle (2025)</tspan></text>
    <text x="35" y="618" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700">AWS Certified Solutions Architect - Associate <tspan font-weight="400" fill="#334155">&bull; Amazon Web Services (2025)</tspan></text>
