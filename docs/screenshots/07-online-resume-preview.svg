  <text x="59" y="41" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" text-anchor="middle">R</text>
  <text x="90" y="41" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="20" font-weight="700">ResumeSphere</text>
  
  <text x="770" y="41" fill="#8b5cf6" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600">My Resumes</text>
  <rect x="880" y="18" width="130" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="945" y="40" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle">✏️ Edit Details</text>
  <rect x="1025" y="18" width="135" height="34" rx="8" fill="url(#btnPdfGrad)"/>
  <text x="1092" y="40" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">📥 Download PDF</text>

