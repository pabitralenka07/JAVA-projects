    <text x="315" y="84" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="end">✓ 4 lines</text>

    <!-- Item 3 -->
    <rect y="112" width="330" height="46" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="15" y="140" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">💼 Work Experience (2 items)</text>
    <text x="315" y="140" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="end">✓ Active</text>

    <!-- Item 4 -->
    <rect y="168" width="330" height="46" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="15" y="196" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">🚀 Key Projects (2 items)</text>
    <text x="315" y="196" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="end">✓ Active</text>

