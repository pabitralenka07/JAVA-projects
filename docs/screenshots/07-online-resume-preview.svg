  <text x="65" y="135" fill="#c4b5fd" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">RESUME BUILDER CONTROLS</text>
  <text x="65" y="165" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="20" font-weight="700">Software Engineer Resume</text>
  <text x="65" y="188" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">ATS-compliant layout with OpenPDF export.</text>

