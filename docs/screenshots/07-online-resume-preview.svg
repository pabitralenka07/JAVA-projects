    <rect y="224" width="330" height="46" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="15" y="252" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">⚡ Technical Skills (3 categories)</text>
    <text x="315" y="252" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="end">✓ 15 tags</text>

