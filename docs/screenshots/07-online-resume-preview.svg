    <text x="35" y="233" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700">Frameworks &amp; Backend: <tspan font-weight="400" fill="#334155">Spring Boot 3, Spring Data JPA, Hibernate ORM, JUnit 5, Mockito</tspan></text>
    <text x="35" y="248" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700">Tools &amp; Infrastructure: <tspan font-weight="400" fill="#334155">Maven, Docker, H2 Database, MySQL 8.4, Git, OpenPDF, Linux</tspan></text>

    <!-- Work Experience Section -->
    <text x="35" y="278" fill="#7c3aed" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">WORK EXPERIENCE</text>
    <line x1="35" y1="285" x2="675" y2="285" stroke="#7c3aed" stroke-width="1.5"/>
    
    <!-- Experience 1 -->
