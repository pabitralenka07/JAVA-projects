<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="480" fill="#0B0F17" rx="16" />

  <!-- Window Container -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <!-- Window Frame -->
    <rect width="520" height="420" fill="#111827" rx="12" stroke="#374151" stroke-width="1.5" />

    <!-- Window Top Bar -->
    <rect width="520" height="38" fill="#1F2937" rx="12" />
    <rect width="520" height="15" y="23" fill="#1F2937" />
    <circle cx="20" cy="19" r="6" fill="#EF4444" />
    <circle cx="38" cy="19" r="6" fill="#F59E0B" />
    <circle cx="56" cy="19" r="6" fill="#10B981" />
    <text x="260" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9CA3AF" text-anchor="middle" font-weight="500">FortressPass — Secure Password Generator</text>

    <!-- Content Area -->
    <g transform="translate(30, 60)">
      <!-- Title -->
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#F9FAFB">FortressPass Generator</text>
      <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9CA3AF">Cryptographically strong passwords using SecureRandom</text>

      <!-- Password Output Box -->
      <g transform="translate(0, 55)">
        <rect width="460" height="52" fill="#1F2937" rx="8" stroke="#4B5563" stroke-width="1" />
        <text x="16" y="33" font-family="'Courier New', Courier, monospace" font-size="18" font-weight="bold" fill="#F9FAFB" letter-spacing="1">zK8$vL@9#mP!2zQ%</text>
        
        <!-- Copy Button -->
        <rect x="330" y="9" width="75" height="34" fill="#10B981" rx="6" />
        <text x="367" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">✓ Copied!</text>

        <!-- Refresh Button -->
        <rect x="412" y="9" width="36" height="34" fill="#4F46E5" rx="6" />
        <text x="430" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">↻</text>
      </g>

      <!-- Strength Meter -->
      <g transform="translate(0, 122)">
        <!-- Track -->
        <rect width="460" height="8" fill="#374151" rx="4" />
        <!-- Fill (Strong: 80% / Cyan/Green) -->
        <rect width="368" height="8" fill="#22C55E" rx="4" />
        
        <!-- Strength Label -->
        <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#22C55E">Strength: Strong (84.2 bits)</text>
        <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#9CA3AF">Strong password: high entropy, resistant to automated cracking.</text>
      </g>

      <!-- Configuration Card -->
      <g transform="translate(0, 185)">
        <rect width="460" height="150" fill="#1F2937" rx="8" stroke="#374151" stroke-width="1" />

        <!-- Slider Row -->
        <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#F9FAFB">Password Length</text>
        <text x="444" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#818CF8" text-anchor="end">16</text>
        
        <!-- Slider Track & Thumb -->
        <rect x="16" y="38" width="428" height="6" fill="#374151" rx="3" />
        <rect x="16" y="38" width="85" height="6" fill="#4F46E5" rx="3" />
        <circle cx="101" cy="41" r="9" fill="#818CF8" stroke="#FFFFFF" stroke-width="2" />

        <!-- Options Checkboxes Grid -->
        <g transform="translate(16, 68)">
          <!-- Option 1 -->
          <rect x="0" y="0" width="18" height="18" fill="#4F46E5" rx="4" />
          <path d="M4 9 L7 12 L14 5" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
          <text x="28" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#E5E7EB">Uppercase (A-Z)</text>

          <!-- Option 2 -->
          <rect x="230" y="0" width="18" height="18" fill="#4F46E5" rx="4" />
          <path d="M234 9 L237 12 L244 5" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
          <text x="258" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#E5E7EB">Lowercase (a-z)</text>

          <!-- Option 3 -->
          <rect x="0" y="34" width="18" height="18" fill="#4F46E5" rx="4" />
          <path d="M4 43 L7 46 L14 39" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
          <text x="28" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#E5E7EB">Numbers (0-9)</text>

          <!-- Option 4 -->
          <rect x="230" y="34" width="18" height="18" fill="#4F46E5" rx="4" />
          <path d="M234 43 L237 46 L244 39" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
          <text x="258" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#E5E7EB">Symbols (!@#$)</text>
        </g>
      </g>
    </g>
  </g>
</svg>
