<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="760" height="640" fill="#0B0F17" rx="16" />

  <!-- Invoice Container Window -->
  <g transform="translate(40, 25)" filter="url(#shadow)">
    <!-- Window Outer Frame -->
    <rect width="680" height="590" fill="#FFFFFF" rx="12" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Top Accent Bar -->
    <rect width="680" height="8" fill="#2563EB" rx="12" />
    <rect width="680" height="4" y="4" fill="#2563EB" />

    <!-- Header Section -->
    <g transform="translate(35, 30)">
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#1E293B">POWERGRID ELECTRICITY BOARD</text>
      <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">Official Utility Consumption &amp; Progressive Tariff Statement</text>
      
      <!-- Unpaid Badge -->
      <rect x="520" y="6" width="90" height="28" fill="#FEE2E2" rx="6" />
      <text x="565" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#DC2626" text-anchor="middle">UNPAID</text>

      <line x1="0" y1="58" x2="610" y2="58" stroke="#E2E8F0" stroke-width="1.5" />
    </g>

    <!-- Details Columns -->
    <g transform="translate(35, 110)">
      <!-- Left Column: Customer Info -->
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748B">CONSUMER DETAILS</text>
      <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Pabitra Sharma</text>
      <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">Meter No: <tspan font-weight="700">MTR-1001</tspan></text>
      <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">Phone: +91-9876543210</text>
      <text x="0" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">Address: 42 Park Street, Kolkata</text>

      <!-- Right Column: Invoice Specs -->
      <text x="350" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748B">INVOICE SPECIFICATIONS</text>
      <text x="350" y="22" font-family="Monospaced" font-size="14" font-weight="700" fill="#2563EB">BILL-202610-53F94F</text>
      <text x="350" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">Billing Date: 2026-10-27</text>
      <text x="350" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#DC2626">Due Date: 2026-11-11</text>
      <text x="350" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">Units Billed: <tspan font-weight="700">350 kWh</tspan></text>
    </g>

    <!-- Tariff Table -->
    <g transform="translate(35, 220)">
      <!-- Table Header -->
      <rect width="610" height="32" fill="#1E293B" rx="6" />
      <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">TARIFF SLAB</text>
      <text x="180" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">UNITS BILLED</text>
      <text x="340" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">RATE / UNIT</text>
      <text x="590" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="end">AMOUNT</text>

      <!-- Row 1: Slab 1 -->
      <rect y="36" width="610" height="30" fill="#F8FAFC" />
      <text x="16" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">Slab 1 (1 - 100 kWh)</text>
      <text x="180" y="56" font-family="Monospaced" font-size="12" fill="#0F172A">100 kWh</text>
      <text x="340" y="56" font-family="Monospaced" font-size="12" fill="#0F172A">INR 3.00</text>
      <text x="590" y="56" font-family="Monospaced" font-size="12" font-weight="600" fill="#0F172A" text-anchor="end">INR 300.00</text>

      <!-- Row 2: Slab 2 -->
      <rect y="68" width="610" height="30" fill="#FFFFFF" />
      <text x="16" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">Slab 2 (101 - 300 kWh)</text>
      <text x="180" y="88" font-family="Monospaced" font-size="12" fill="#0F172A">200 kWh</text>
      <text x="340" y="88" font-family="Monospaced" font-size="12" fill="#0F172A">INR 4.50</text>
      <text x="590" y="88" font-family="Monospaced" font-size="12" font-weight="600" fill="#0F172A" text-anchor="end">INR 900.00</text>

      <!-- Row 3: Slab 3 -->
      <rect y="100" width="610" height="30" fill="#F8FAFC" />
      <text x="16" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">Slab 3 (301 - 500 kWh)</text>
      <text x="180" y="120" font-family="Monospaced" font-size="12" fill="#0F172A">50 kWh</text>
      <text x="340" y="120" font-family="Monospaced" font-size="12" fill="#0F172A">INR 6.50</text>
      <text x="590" y="120" font-family="Monospaced" font-size="12" font-weight="600" fill="#0F172A" text-anchor="end">INR 325.00</text>
    </g>

    <!-- Calculation Breakdown & Total Section -->
    <g transform="translate(35, 385)">
      <line x1="320" y1="0" x2="610" y2="0" stroke="#CBD5E1" stroke-width="1" />

      <text x="330" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">Energy Charges (Subtotal):</text>
      <text x="590" y="24" font-family="Monospaced" font-size="13" font-weight="600" fill="#0F172A" text-anchor="end">INR 1,525.00</text>

      <text x="330" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">Fixed Meter Maintenance Rent:</text>
      <text x="590" y="46" font-family="Monospaced" font-size="13" font-weight="600" fill="#0F172A" text-anchor="end">INR 50.00</text>

      <text x="330" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">State Electricity Tax (5%):</text>
      <text x="590" y="68" font-family="Monospaced" font-size="13" font-weight="600" fill="#0F172A" text-anchor="end">INR 76.25</text>

      <!-- Total Box -->
      <rect x="320" y="82" width="290" height="42" fill="#EFF6FF" rx="6" stroke="#BFDBFE" stroke-width="1" />
      <text x="335" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#1E40AF">TOTAL PAYABLE:</text>
      <text x="595" y="109" font-family="Monospaced" font-size="17" font-weight="800" fill="#1E40AF" text-anchor="end">INR 1,651.25</text>
    </g>

    <!-- Footer Note -->
    <g transform="translate(35, 545)">
      <line x1="0" y1="0" x2="610" y2="0" stroke="#E2E8F0" stroke-width="1" />
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">This is a computer-generated invoice. Generated using OpenPDF &amp; Pure JDBC with PreparedStatement.</text>
    </g>
  </g>
</svg>
