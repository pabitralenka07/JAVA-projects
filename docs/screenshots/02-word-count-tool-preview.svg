<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="540" fill="#0B0F17" rx="16" />

  <!-- Main Window -->
  <g transform="translate(30, 20)" filter="url(#shadow)">
    <rect width="740" height="500" fill="#111827" rx="12" stroke="#374151" stroke-width="1.5" />

    <!-- Window Header -->
    <rect width="740" height="38" fill="#1F2937" rx="12" />
    <rect width="740" height="15" y="23" fill="#1F2937" />
    <circle cx="20" cy="19" r="6" fill="#EF4444" />
    <circle cx="38" cy="19" r="6" fill="#F59E0B" />
    <circle cx="56" cy="19" r="6" fill="#10B981" />
    <text x="370" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9CA3AF" text-anchor="middle" font-weight="500">LexiCount — Text Analyzer &amp; Word Counter</text>

    <!-- Top Action Bar -->
    <g transform="translate(25, 55)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#F9FAFB">LexiCount Text Analyzer</text>
      <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9CA3AF">Real-time lexical statistics, Hash-Map frequency rankings, and stop-word filtering</text>

      <!-- Action buttons -->
      <g transform="translate(420, 6)">
        <!-- Checkbox Stop-word -->
        <rect x="0" y="4" width="16" height="16" fill="#4F46E5" rx="3" />
        <path d="M4 12 L7 15 L13 8" stroke="#FFFFFF" stroke-width="2" fill="none" />
        <text x="22" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#F9FAFB">Stop-words</text>

        <!-- Browse Button -->
        <rect x="95" y="0" width="105" height="28" fill="#4F46E5" rx="6" />
        <text x="147" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">📂 Browse Files</text>

        <!-- Sample Button -->
        <rect x="210" y="0" width="60" height="28" fill="#1F2937" rx="6" stroke="#4B5563" stroke-width="1" />
        <text x="240" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#E5E7EB" text-anchor="middle">Sample</text>
      </g>
    </g>

    <!-- Center Workspace -->
    <g transform="translate(25, 115)">
      <!-- Left: Editor Pane -->
      <rect width="400" height="260" fill="#1F2937" rx="8" stroke="#374151" stroke-width="1" />
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#9CA3AF">SOURCE TEXT / EDITOR</text>
      <rect x="12" y="34" width="376" height="214" fill="#18202F" rx="6" />
      
      <text x="24" y="58" font-family="Monospaced" font-size="12" fill="#93C5FD">Object-Oriented Programming (OOP) is a paradigm</text>
      <text x="24" y="78" font-family="Monospaced" font-size="12" fill="#93C5FD">based on "objects" containing data and code.</text>
      <text x="24" y="108" font-family="Monospaced" font-size="12" fill="#E5E7EB">Java is class-based and designed to compile to</text>
      <text x="24" y="128" font-family="Monospaced" font-size="12" fill="#E5E7EB">bytecode running on any JVM machine.</text>
      <text x="24" y="158" font-family="Monospaced" font-size="12" fill="#A7F3D0">The 4 core pillars: Encapsulation, Abstraction,</text>
      <text x="24" y="178" font-family="Monospaced" font-size="12" fill="#A7F3D0">Inheritance, and Polymorphism.</text>

      <!-- Right: Frequency Ranking Table -->
      <g transform="translate(415, 0)">
        <rect width="275" height="260" fill="#1F2937" rx="8" stroke="#374151" stroke-width="1" />
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#9CA3AF">TOP FREQUENT WORDS (HASHMAP)</text>
        <rect x="12" y="34" width="251" height="214" fill="#18202F" rx="6" />

        <!-- Table Header -->
        <rect x="12" y="34" width="251" height="26" fill="#1E293B" rx="6" />
        <text x="25" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#9CA3AF">RANK</text>
        <text x="75" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#9CA3AF">WORD</text>
        <text x="175" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#9CA3AF">COUNT</text>
        <text x="225" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#9CA3AF">DENSITY</text>

        <!-- Rows -->
        <text x="25" y="78" font-family="Monospaced" font-size="12" fill="#6EE7B7">#1</text>
        <text x="75" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#F9FAFB">java</text>
        <text x="185" y="78" font-family="Monospaced" font-size="12" fill="#F9FAFB">8</text>
        <text x="235" y="78" font-family="Monospaced" font-size="12" fill="#10B981">6.2%</text>

        <text x="25" y="104" font-family="Monospaced" font-size="12" fill="#6EE7B7">#2</text>
        <text x="75" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#F9FAFB">programming</text>
        <text x="185" y="104" font-family="Monospaced" font-size="12" fill="#F9FAFB">6</text>
        <text x="235" y="104" font-family="Monospaced" font-size="12" fill="#10B981">4.7%</text>

        <text x="25" y="130" font-family="Monospaced" font-size="12" fill="#6EE7B7">#3</text>
        <text x="75" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#F9FAFB">class</text>
        <text x="185" y="130" font-family="Monospaced" font-size="12" fill="#F9FAFB">5</text>
        <text x="235" y="130" font-family="Monospaced" font-size="12" fill="#10B981">3.9%</text>

        <text x="25" y="156" font-family="Monospaced" font-size="12" fill="#6EE7B7">#4</text>
        <text x="75" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#F9FAFB">polymorphism</text>
        <text x="185" y="156" font-family="Monospaced" font-size="12" fill="#F9FAFB">4</text>
        <text x="235" y="156" font-family="Monospaced" font-size="12" fill="#10B981">3.1%</text>

        <text x="25" y="182" font-family="Monospaced" font-size="12" fill="#6EE7B7">#5</text>
        <text x="75" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#F9FAFB">bytecode</text>
        <text x="185" y="182" font-family="Monospaced" font-size="12" fill="#F9FAFB">3</text>
        <text x="235" y="182" font-family="Monospaced" font-size="12" fill="#10B981">2.3%</text>
      </g>
    </g>

    <!-- Bottom Dashboard Cards -->
    <g transform="translate(25, 390)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="162" height="75" fill="#1F2937" rx="8" stroke="#374151" stroke-width="1" />
        <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#9CA3AF">TOTAL WORDS</text>
        <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#10B981">128 words</text>
        <text x="12" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#9CA3AF">~0.6 min read time</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(176, 0)">
        <rect width="162" height="75" fill="#1F2937" rx="8" stroke="#374151" stroke-width="1" />
        <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#9CA3AF">CHARACTERS</text>
        <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#818CF8">892 total</text>
        <text x="12" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#9CA3AF">764 without spaces</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(352, 0)">
        <rect width="162" height="75" fill="#1F2937" rx="8" stroke="#374151" stroke-width="1" />
        <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#9CA3AF">STRUCTURE</text>
        <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#F59E0B">12 lines</text>
        <text x="12" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#9CA3AF">8 sentences detected</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(528, 0)">
        <rect width="162" height="75" fill="#1F2937" rx="8" stroke="#374151" stroke-width="1" />
        <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#9CA3AF">VOCABULARY</text>
        <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#38BDF8">74 unique</text>
        <text x="12" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#9CA3AF">3 paragraphs</text>
      </g>
    </g>
  </g>
</svg>
