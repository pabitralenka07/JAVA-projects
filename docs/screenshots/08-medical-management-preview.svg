<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <!-- Teal Glow -->
    <radialGradient id="glowTeal" cx="15%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>

    <!-- Indigo Glow -->
    <radialGradient id="glowIndigo" cx="85%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  <rect width="1200" height="800" fill="url(#glowTeal)"/>
  <rect width="1200" height="800" fill="url(#glowIndigo)"/>

  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="1200" height="70" fill="#0b1120" fill-opacity="0.9" stroke="#334155" stroke-opacity="0.4"/>
  <text x="50" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">
    🩺 HealthPulse <tspan fill="#38bdf8">Clinic Management</tspan>
  </text>
  <rect x="360" y="24" width="125" height="26" rx="13" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.4"/>
  <text x="422" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#818cf8">SPRING SECURITY 6</text>

  <!-- Top Right Role Switcher Preview -->
  <rect x="910" y="20" width="105" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="962" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Dr. House (MD)</text>

  <rect x="1030" y="20" width="120" height="32" rx="8" fill="#0284c7" stroke="#38bdf8"/>
  <text x="1090" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Sign Out</text>

  <!-- Dashboard Header Title -->
  <g transform="translate(50, 105)">
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#f8fafc">
      Clinical Executive Command Center
    </text>
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">
      Role-Based Access Control &bull; Real-Time Consultation Queues &bull; Conflict-Free Appointments
    </text>
  </g>

  <!-- 4 KPI Metrics Grid -->
  <g transform="translate(50, 190)">
    <!-- KPI 1: Doctors -->
    <rect x="0" y="0" width="260" height="95" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.6" filter="url(#cardShadow)"/>
    <rect x="20" y="22" width="50" height="50" rx="12" fill="#14b8a6" fill-opacity="0.15"/>
    <text x="45" y="54" text-anchor="middle" font-size="24">🩺</text>
    <text x="85" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#f8fafc">3</text>
    <text x="85" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">ACTIVE SPECIALISTS</text>

    <!-- KPI 2: Patients -->
    <rect x="280" y="0" width="260" height="95" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.6" filter="url(#cardShadow)"/>
    <rect x="300" y="22" width="50" height="50" rx="12" fill="#0284c7" fill-opacity="0.15"/>
    <text x="325" y="54" text-anchor="middle" font-size="24">👤</text>
    <text x="365" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#f8fafc">2</text>
    <text x="365" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">ENROLLED PATIENTS</text>

    <!-- KPI 3: Appointments -->
    <rect x="560" y="0" width="260" height="95" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.6" filter="url(#cardShadow)"/>
    <rect x="580" y="22" width="50" height="50" rx="12" fill="#f59e0b" fill-opacity="0.15"/>
    <text x="605" y="54" text-anchor="middle" font-size="24">📅</text>
    <text x="645" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#f8fafc">3</text>
    <text x="645" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">TOTAL VISITS</text>

    <!-- KPI 4: Prescriptions -->
    <rect x="840" y="0" width="260" height="95" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.6" filter="url(#cardShadow)"/>
    <rect x="860" y="22" width="50" height="50" rx="12" fill="#10b981" fill-opacity="0.15"/>
    <text x="885" y="54" text-anchor="middle" font-size="24">💊</text>
    <text x="925" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#f8fafc">1</text>
    <text x="925" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">DIGITAL RX ISSUED</text>
  </g>

  <!-- Main Content Split: Left (Appointments Queue) + Right (Rx & EMR Detail) -->
  <g transform="translate(50, 315)">
    <!-- Left Card: Appointments Queue Table -->
    <rect x="0" y="0" width="710" height="440" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.6" filter="url(#cardShadow)"/>
    <text x="25" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Clinical Appointments Queue</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Double-booking protected &bull; Live state transitions</text>

    <!-- Table Header -->
    <rect x="20" y="80" width="670" height="36" rx="6" fill="#1e293b" fill-opacity="0.8"/>
    <text x="35" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">TIME &amp; SLOT</text>
    <text x="180" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">PATIENT</text>
    <text x="320" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">SPECIALIST</text>
    <text x="475" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">STATUS</text>
    <text x="590" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">ACTIONS</text>

    <!-- Row 1: Scheduled -->
    <g transform="translate(20, 130)">
      <line x1="0" y1="52" x2="670" y2="52" stroke="#334155" stroke-opacity="0.4"/>
      <text x="15" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Oct 29, 10:00</text>
      <text x="15" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Appt #1</text>
      <text x="160" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">John Doe</text>
      <text x="160" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8">Blood: O+</text>
      <text x="300" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1">Dr. Gregory House</text>
      <text x="300" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#2dd4bf">Diagnostics</text>
      <rect x="450" y="12" width="85" height="24" rx="12" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-opacity="0.4"/>
      <text x="492" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">SCHEDULED</text>
      <rect x="560" y="12" width="70" height="24" rx="6" fill="#0284c7"/>
      <text x="595" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Confirm</text>
    </g>

    <!-- Row 2: Confirmed -->
    <g transform="translate(20, 200)">
      <line x1="0" y1="52" x2="670" y2="52" stroke="#334155" stroke-opacity="0.4"/>
      <text x="15" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Oct 28, 14:30</text>
      <text x="15" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Appt #2</text>
      <text x="160" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Sarah Connor</text>
      <text x="160" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#fb7185">Blood: A-</text>
      <text x="300" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1">Dr. John Watson</text>
      <text x="300" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#2dd4bf">General Medicine</text>
      <rect x="450" y="12" width="85" height="24" rx="12" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.4"/>
      <text x="492" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">CONFIRMED</text>
      <rect x="560" y="12" width="70" height="24" rx="6" fill="#10b981"/>
      <text x="595" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Complete</text>
    </g>

    <!-- Row 3: Completed -->
    <g transform="translate(20, 270)">
      <text x="15" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Oct 22, 11:00</text>
      <text x="15" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Appt #3</text>
      <text x="160" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">John Doe</text>
      <text x="160" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8">Blood: O+</text>
      <text x="300" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1">Dr. John Watson</text>
      <text x="300" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#2dd4bf">General Medicine</text>
      <rect x="450" y="12" width="85" height="24" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="492" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399">COMPLETED</text>
      <rect x="560" y="12" width="70" height="24" rx="6" fill="#334155"/>
      <text x="595" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">Rx &amp; EMR</text>
    </g>
  </g>

  <!-- Right Panel: Digital Rx & EMR Summary Preview -->
  <g transform="translate(780, 315)">
    <rect x="0" y="0" width="370" height="440" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.6" filter="url(#cardShadow)"/>
    <text x="25" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Digital Rx Prescription</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Patient: John Doe &bull; Issued by Dr. Watson</text>

    <!-- Rx Inner Card -->
    <rect x="20" y="80" width="330" height="150" rx="12" fill="#0b1120" stroke="#14b8a6" stroke-opacity="0.4"/>
    <text x="35" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#2dd4bf">PRESCRIBED MEDICATIONS</text>
    <text x="35" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">&bull; Amoxicillin 500mg capsules (15 caps)</text>
    <text x="35" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">&bull; Paracetamol 650mg tablets (10 tabs)</text>
    <text x="35" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">&bull; Cetirizine 10mg tablets (5 tabs)</text>
    <text x="35" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Dosage: 1 capsule 3x daily after meals</text>

    <!-- EMR Record Summary -->
    <rect x="20" y="245" width="330" height="170" rx="12" fill="#0b1120" stroke="#6366f1" stroke-opacity="0.4"/>
    <text x="35" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#818cf8">ELECTRONIC HEALTH RECORD</text>
    <text x="35" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Acute Bronchitis</text>
    <text x="35" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Symptoms: Severe dry cough, chest tightness</text>
    <text x="35" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Vitals: BP 120/80 &bull; SpO2 98% &bull; HR 72</text>
    <rect x="35" y="365" width="300" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="185" y="386" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">View Full Electronic Health History &rarr;</text>
  </g>
</svg>
