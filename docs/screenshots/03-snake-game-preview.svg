<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <radialGradient id="glowApple" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="70%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </radialGradient>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="760" height="620" fill="#0B0F17" rx="16" />

  <!-- Main Game Window -->
  <g transform="translate(30, 20)" filter="url(#shadow)">
    <rect width="700" height="580" fill="#0F172A" rx="12" stroke="#334155" stroke-width="1.5" />

    <!-- Window Top Header Bar -->
    <rect width="700" height="38" fill="#1E293B" rx="12" />
    <rect width="700" height="15" y="23" fill="#1E293B" />
    <circle cx="20" cy="19" r="6" fill="#EF4444" />
    <circle cx="38" cy="19" r="6" fill="#F59E0B" />
    <circle cx="56" cy="19" r="6" fill="#10B981" />
    <text x="350" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle" font-weight="500">Retro Snake Arcade 2D</text>

    <!-- Scoreboard Section -->
    <g transform="translate(20, 50)">
      <!-- Score Card -->
      <g transform="translate(0, 0)">
        <rect width="150" height="52" fill="#1E293B" rx="8" stroke="#334155" stroke-width="1" />
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">SCORE</text>
        <text x="12" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#34D399">180</text>
      </g>

      <!-- High Score Card -->
      <g transform="translate(170, 0)">
        <rect width="150" height="52" fill="#1E293B" rx="8" stroke="#334155" stroke-width="1" />
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">HIGH SCORE</text>
        <text x="12" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#FBBF24">450</text>
      </g>

      <!-- Level Card -->
      <g transform="translate(340, 0)">
        <rect width="150" height="52" fill="#1E293B" rx="8" stroke="#334155" stroke-width="1" />
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">LEVEL</text>
        <text x="12" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">3</text>
      </g>

      <!-- Speed Delay Card -->
      <g transform="translate(510, 0)">
        <rect width="150" height="52" fill="#1E293B" rx="8" stroke="#334155" stroke-width="1" />
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">TICK DELAY</text>
        <text x="12" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#94A3B8">114ms</text>
      </g>
    </g>

    <!-- Arcade Canvas Section -->
    <g transform="translate(20, 115)">
      <!-- Canvas border & background -->
      <rect width="660" height="440" fill="#090D16" rx="8" stroke="#334155" stroke-width="1" />

      <!-- Subtle Grid Lines -->
      <g stroke="#1E293B" stroke-width="0.8" opacity="0.6">
        <line x1="60" y1="0" x2="60" y2="440" />
        <line x1="120" y1="0" x2="120" y2="440" />
        <line x1="180" y1="0" x2="180" y2="440" />
        <line x1="240" y1="0" x2="240" y2="440" />
        <line x1="300" y1="0" x2="300" y2="440" />
        <line x1="360" y1="0" x2="360" y2="440" />
        <line x1="420" y1="0" x2="420" y2="440" />
        <line x1="480" y1="0" x2="480" y2="440" />
        <line x1="540" y1="0" x2="540" y2="440" />
        <line x1="600" y1="0" x2="600" y2="440" />

        <line x1="0" y1="60" x2="660" y2="60" />
        <line x1="0" y1="120" x2="660" y2="120" />
        <line x1="0" y1="180" x2="660" y2="180" />
        <line x1="0" y1="240" x2="660" y2="240" />
        <line x1="0" y1="300" x2="660" y2="300" />
        <line x1="0" y1="360" x2="660" y2="360" />
        <line x1="0" y1="420" x2="660" y2="420" />
      </g>

      <!-- Apple / Food Item -->
      <g transform="translate(480, 168)">
        <circle cx="12" cy="12" r="10" fill="url(#glowApple)" />
        <circle cx="8" cy="8" r="3" fill="#FECACA" opacity="0.8" />
        <ellipse cx="14" cy="2" rx="3" ry="2" fill="#4ADE80" />
      </g>

      <!-- Snake Segments -->
      <!-- Body segments -->
      <g fill="url(#snakeGrad)">
        <rect x="240" y="216" width="22" height="22" rx="6" />
        <rect x="264" y="216" width="22" height="22" rx="6" />
        <rect x="288" y="216" width="22" height="22" rx="6" />
        <rect x="312" y="216" width="22" height="22" rx="6" />
        <rect x="336" y="216" width="22" height="22" rx="6" />
        <rect x="360" y="216" width="22" height="22" rx="6" />
        <rect x="360" y="192" width="22" height="22" rx="6" />
        <rect x="360" y="168" width="22" height="22" rx="6" />
        <rect x="384" y="168" width="22" height="22" rx="6" />
        <rect x="408" y="168" width="22" height="22" rx="6" />
      </g>

      <!-- Snake Head (at x=432, y=168, facing RIGHT) -->
      <g transform="translate(432, 168)">
        <rect width="22" height="22" fill="#34D399" rx="6" />
        <!-- Eyes -->
        <circle cx="16" cy="6" r="3" fill="#FFFFFF" />
        <circle cx="16" cy="16" r="3" fill="#FFFFFF" />
        <circle cx="17" cy="6" r="1.5" fill="#000000" />
        <circle cx="17" cy="16" r="1.5" fill="#000000" />
      </g>
    </g>
  </g>
</svg>
