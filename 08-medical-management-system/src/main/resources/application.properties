spring.application.name=medical-management-system
server.port=8080

# Default DataSource: H2 In-Memory Database (Zero-Install Guarantee)
spring.datasource.url=jdbc:h2:mem:medicaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging
logging.level.com.portfolio.medical=INFO
logging.level.org.springframework.security=WARN
