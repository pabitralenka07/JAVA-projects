<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Medical Record - Doctor Workbench</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="navbar">
    <a th:href="@{/doctor/dashboard}" class="nav-brand">
        <span class="logo-icon">🩺</span>
        <span>HealthPulse &bull; Clinical Workbench</span>
    </a>
    <nav class="nav-links">
        <a th:href="@{/doctor/dashboard}" class="btn btn-secondary btn-sm">&larr; Back to Workbench</a>
    </nav>
</header>

<main class="container" style="max-width: 680px; margin-top: 2rem;">
    <div class="card" style="padding: 2.25rem;">
        <div style="margin-bottom: 2rem;">
            <div class="badge badge-doctor" style="margin-bottom: 0.5rem;">Electronic Medical Record (EMR)</div>
            <h2 style="font-size: 1.6rem; margin-bottom: 0.25rem;">Create Diagnostic Record</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">
                Logging medical diagnosis for patient: <strong style="color: var(--text-primary);" th:text="${patient.user.fullName}">John Doe</strong>
                (DOB: <span th:text="${patient.dateOfBirth}">1990-05-15</span> &bull; Blood: <span th:text="${patient.bloodGroup}">O+</span>)
            </p>
        </div>

        <form th:action="@{/doctor/records}" method="post">
            <input type="hidden" name="patientId" th:value="${patient.id}">

            <div class="form-group">
                <label for="diagnosis">Clinical Diagnosis *</label>
                <input type="text" id="diagnosis" name="diagnosis" required placeholder="e.g. Acute Upper Respiratory Infection, Type 2 Diabetes">
            </div>

            <div class="form-group">
                <label for="symptoms">Observed Symptoms &amp; Clinical Presentation</label>
                <textarea id="symptoms" name="symptoms" rows="3" placeholder="e.g. Dry cough, low-grade fever, fatigue, congestion for 4 days..."></textarea>
            </div>

            <div class="form-group">
                <label for="treatmentPlan">Treatment &amp; Management Plan</label>
                <textarea id="treatmentPlan" name="treatmentPlan" rows="3" placeholder="e.g. Antibiotic course, bed rest, dietary modifications, follow-up in 10 days..."></textarea>
            </div>

            <div class="form-group">
                <label for="notes">Internal Physician Clinical Notes</label>
                <textarea id="notes" name="notes" rows="2" placeholder="e.g. Vitals: BP 120/80, SpO2 98%, HR 72. Patient advised against strenuous exercise."></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem; font-size: 1rem; margin-top: 1rem;">
                📋 Save to Electronic Health Record
            </button>
        </form>
    </div>
</main>

<footer>
    <p>&copy; 2026 HealthPulse Medical Management System</p>
</footer>

</body>
</html>
