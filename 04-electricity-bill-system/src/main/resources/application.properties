# Database Connection Configuration
# Supported types: 'h2' (in-memory zero-install default) or 'mysql'
db.type=h2

# H2 In-Memory Configuration (Zero setup required)
db.h2.url=jdbc:h2:mem:electricity_db;DB_CLOSE_DELAY=-1;MODE=MySQL
db.h2.username=sa
db.h2.password=

# MySQL Profile Configuration (Used when db.type=mysql or via environment variables)
db.mysql.url=jdbc:mysql://localhost:3306/electricity_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.mysql.username=appuser
db.mysql.password=apppassword

# Tariff Constants
tariff.fixed.meter.rent=50.00
tariff.tax.percentage=5.0
tariff.late.fee.percentage=2.0
tariff.grace.period.days=15
