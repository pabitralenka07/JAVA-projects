spring.application.name=isp-automation-system
server.port=8080

# Default DataSource: H2 In-Memory Database (Zero-Install Guarantee)
spring.datasource.url=jdbc:h2:mem:ispdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Billing Automation Scheduler Config
# Run billing generation cron every day at 00:00 (midnight)
isp.billing.cron=0 0 0 1 * ?
# Tax rate (e.g. 18% standard VAT/GST)
isp.billing.tax-rate=0.18

# Logging
logging.level.com.portfolio.isp=INFO
